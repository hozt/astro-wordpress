name = "astro-wp"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Do NOT put site-specific build vars (API_URL, SITE_URL, etc.) in [vars] here.
# Forks merge this file; a hardcoded API_URL from the template CMS will make
# every downstream site build against the wrong WordPress instance.
# Set API_URL / SITE_URL in the Cloudflare Pages dashboard (Production + Preview)
# and in local `.env` / `.dev.vars` instead. See CLAUDE.md and .env.example.
